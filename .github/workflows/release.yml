name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            arch: x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install root npm dependencies
        run: npm ci

      - name: Install sidecar npm dependencies
        run: npm --prefix sidecar ci

      - name: Build sidecar (bundle + package binary)
        run: |
          npm --prefix sidecar run build
          npm --prefix sidecar run package

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting workflow version to $VERSION"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build & bundle Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # GitHub-provided token for the release upload step
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing & notarization secrets (added later by user).
          # If these are empty, tauri-action gracefully skips signing /
          # notarization and produces an unsigned artifact.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'AOS Mail v__VERSION__'
          releaseBody: |
            See the assets below to download and install AOS Mail.

            Generated by GitHub Actions on tag push.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
