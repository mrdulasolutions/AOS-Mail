name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            arch: arm64
          # x86_64 (Intel) builds were dropped after v0.1.9. GitHub's
          # `macos-13` runners — the last Intel image — are deprecated
          # and consistently queue past `timeout-minutes`, so the
          # x86_64 leg has not produced a release artifact since
          # v0.1.6. All published releases since then have been
          # aarch64-only. Re-add this leg when GitHub offers a stable
          # Intel runner again (unlikely) or move to a self-hosted
          # Intel runner.

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # Stop macOS tar/cp from creating AppleDouble (`._*`) companion
      # files. Without this, `actions/cache@v4` restore via gtar seeds
      # `._*` files into src-tauri/target and sidecar/, which then leak
      # into the .app bundle and break tauri-plugin-updater's tar
      # extractor on the client ("failed to unpack `._AOS Mail.app`").
      COPYFILE_DISABLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install root npm dependencies
        run: npm ci

      - name: Install sidecar npm dependencies
        run: npm --prefix sidecar ci

      - name: Pre-import Apple Developer ID cert into a dedicated keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Why this exists:
          #
          # The next step (`Build sidecar`) runs `npm run runtime-modules`,
          # which codesigns better-sqlite3's native .node binary using the
          # identity from tauri.conf.json. That binary lives inside
          # Contents/Resources/, which tauri-bundler's own codesign pass
          # later does NOT walk — we have to sign it ourselves before the
          # bundle, or Apple's notarytool rejects the whole .app with
          # "The binary is not signed with a valid Developer ID certificate"
          # + "The signature does not include a secure timestamp."
          #
          # tauri-action *does* import the cert into a fresh keychain — but
          # only later, when it actually runs `tauri build`. By that point
          # the .node has been baked into the .app already. So we mirror
          # tauri-action's keychain dance here, ahead of time, in a fresh
          # keychain that we add to codesign's search list.
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "Apple signing secrets missing — skipping cert pre-import."
            echo "Runtime .node files will be left unsigned (matches the"
            echo "unsigned-build path; notarization will not pass)."
            exit 0
          fi
          # Create a fresh keychain with a known password so we can
          # set-key-partition-list non-interactively. The runner's
          # login.keychain-db has an unknown password so we can't reuse
          # it for this dance.
          KEYCHAIN=$RUNNER_TEMP/aos-codesign.keychain-db
          KEYCHAIN_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Don't auto-lock or time out during the build.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Import the cert; -T grants codesign access without GUI prompt.
          P12=$RUNNER_TEMP/aos-devid.p12
          echo "$APPLE_CERTIFICATE" | base64 -d > "$P12"
          security import "$P12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          rm -f "$P12"
          # Authorize codesign etc. to use the imported key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          # Add to the user search list AHEAD of login.keychain-db so
          # `codesign --sign <name>` finds the identity here first.
          security list-keychain -d user -s "$KEYCHAIN" ~/Library/Keychains/login.keychain-db
          # Sanity: identity must be visible to codesign now.
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build sidecar (bundle + package binary)
        run: |
          # Full sidecar pipeline — matches package.json's `build:sidecar`
          # composite script. All four steps are required for tauri-bundler
          # to find what tauri.conf.json declares:
          #
          #   prepare-node     -> src-tauri/binaries/aos-mail-node-<triple>
          #                      (slimmed system node — referenced by
          #                       `externalBin` in tauri.conf.json)
          #   build            -> sidecar/dist/index.cjs (bundled JS)
          #   package          -> src-tauri/binaries/aos-mail-sidecar-<triple>
          #                      (bash stub that execs the bundled node
          #                       against the bundled JS)
          #   runtime-modules  -> sidecar/runtime-modules/ (better-sqlite3
          #                       + bindings, referenced by `resources` in
          #                       tauri.conf.json)
          #
          # Previously this step skipped `prepare-node` and `runtime-modules`,
          # leaving v0.1.8's arm64 build to fail with
          # "resource path `binaries/aos-mail-node-aarch64-apple-darwin`
          # doesn't exist". Earlier releases dodged it via cached state.
          npm --prefix sidecar run prepare-node
          npm --prefix sidecar run build
          npm --prefix sidecar run package
          npm --prefix sidecar run runtime-modules

      - name: Resolve release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting workflow version to $VERSION"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Probe Apple signing secrets
        id: apple
        run: |
          # Surfaces a clear log line so it's obvious in the run UI whether
          # this build is going to be signed/notarized or not. Fingers and
          # eyeballs only — does not echo any secret values.
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ] \
             && [ -n "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" ] \
             && [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "Apple signing secrets present — codesign will run."
            echo "signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "Apple signing secrets missing — producing UNSIGNED artifact."
            echo "signing=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ] \
             && [ -n "${{ secrets.APPLE_PASSWORD }}" ] \
             && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "Apple notarization secrets present — notarytool will run."
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "Apple notarization secrets missing — skipping notarization."
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "Tauri updater signing key present — latest.json will be signed."
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tauri updater signing key missing — auto-update artifact will not be signed."
            echo "updater=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clear cached tauri bundle outputs
        run: |
          # The cargo cache restores `src-tauri/target/`, including any
          # previously-bundled `bundle/macos/AOS Mail.app/`, `bundle/dmg/`,
          # and `bundle/macos/AOS Mail.app.tar.gz`. tauri-bundler treats
          # those as up-to-date on incremental builds, so even when the
          # underlying sidecar binaries change (e.g. the v0.1.8 saga where
          # aos-mail-node went from an 86 KB stub to a 113 MB real binary),
          # the cached `.app.tar.gz` survives untouched and gets uploaded
          # to the release with the stale contents — the .dmg shows the
          # new binary, the updater tarball shows the old one.
          #
          # Force tauri-bundler to regenerate every bundle artifact from
          # scratch on each release.
          rm -rf src-tauri/target/${{ matrix.target }}/release/bundle/ || true

      - name: Strip AppleDouble metadata from build inputs
        run: |
          # Defense in depth alongside COPYFILE_DISABLE=1. Cache restore
          # may have already seeded ._* files before this step runs, and
          # `npm install` on macOS occasionally leaves them in
          # node_modules. Anything tauri-bundler copies into the .app
          # must be free of these or the updater tarball will contain
          # them and break extraction client-side.
          find src-tauri/target sidecar node_modules -name '._*' -type f -delete 2>/dev/null || true
          find . -maxdepth 6 -name '._*' -type f -delete 2>/dev/null || true

      - name: Build & bundle Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # GitHub-provided token for the release upload step.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing key — signs the auto-update package +
          # latest.json. Generated locally via `npx @tauri-apps/cli signer
          # generate`; the matching public key lives in tauri.conf.json.
          # The PASSWORD secret is optional (key may have no password).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID Application certificate (.p12 base64-encoded)
          # plus its password and the resolved signing identity string. When
          # all three are present, tauri-action will codesign the .app and
          # .dmg with hardened runtime + the entitlements declared in
          # tauri.conf.json. Empty values cause tauri-action to skip signing.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization. tauri-action invokes `xcrun notarytool` under the
          # hood when these are populated. APPLE_PASSWORD must be an
          # app-specific password generated at appleid.apple.com.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AOS Mail ${{ github.ref_name }}"
          releaseBody: |
            ## AOS Mail ${{ github.ref_name }}

            See attached `.dmg` for installation. Auto-update users will pick
            up this release through the in-app updater (`latest.json`) once
            this draft is published.

            Generated by GitHub Actions on tag push.
          releaseDraft: true
          prerelease: false
          # When TAURI_SIGNING_PRIVATE_KEY is present, tauri-action also
          # produces the auto-update bundle (.app.tar.gz + .sig pair) and
          # latest.json alongside the .dmg, then uploads them to the draft
          # release. softprops/action-gh-release is invoked by tauri-action
          # internally for the upload.
          args: --target ${{ matrix.target }} --verbose

      - name: Verify update tarball has no AppleDouble entries
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          TARBALL=$(ls "$BUNDLE_DIR"/*.app.tar.gz 2>/dev/null | head -n1 || true)
          if [ -z "$TARBALL" ]; then
            echo "::error::No .app.tar.gz produced in $BUNDLE_DIR — updater bundle missing."
            exit 1
          fi
          # BSD `tar -t` on macOS silently hides AppleDouble entries, so
          # parse tar headers directly from the raw stream. Each header
          # is 512 bytes; bytes 0..99 are the filename, 124..134 the
          # octal size. Walk and count any entry starting with `._` or
          # containing `/._`.
          COUNT=$(gzip -dc "$TARBALL" | python3 -c '
          import sys
          data = sys.stdin.buffer.read(); i = 0; n = 0
          while i + 512 <= len(data):
              name = data[i:i+100].split(b"\x00", 1)[0].decode("utf-8", "replace")
              if not name:
                  break
              if name.startswith("._") or "/._" in name:
                  n += 1
              try:
                  size = int((data[i+124:i+135].split(b"\x00", 1)[0].strip() or b"0"), 8)
              except ValueError:
                  size = 0
              i += 512 + ((size + 511) // 512) * 512
          print(n)
          ')
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::$TARBALL contains $COUNT AppleDouble (._*) entries — this will break tauri-plugin-updater on macOS clients."
            exit 1
          fi
          echo "OK: $TARBALL contains 0 AppleDouble entries."

      - name: Summarize artifacts
        if: always()
        run: |
          echo "::group::Bundle output"
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/dmg/ 2>/dev/null || echo "(no dmg dir)"
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/macos/ 2>/dev/null || echo "(no macos dir)"
          ls -la src-tauri/target/${{ matrix.target }}/release/bundle/updater/ 2>/dev/null || echo "(no updater dir)"
          echo "::endgroup::"
          echo "Signing: ${{ steps.apple.outputs.signing }}"
          echo "Notarization: ${{ steps.apple.outputs.notarize }}"
          echo "Updater signing: ${{ steps.apple.outputs.updater }}"
