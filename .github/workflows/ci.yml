name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sidecar has its own package.json — install its deps so its tsconfig
      # can resolve types from imapflow/mailparser/etc.
      - run: npm --prefix sidecar ci

      # Root tsconfig.json covers src/renderer + src/shared (the only TS in
      # the desktop app — the main process is Rust under src-tauri/, not TS).
      - run: npx tsc --noEmit

      # Sidecar (long-running Node process bundled with the app) has its own
      # config with stricter `noUncheckedIndexedAccess` / `noImplicitOverride`.
      - run: npx tsc --noEmit -p sidecar/tsconfig.json


  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Check built renderer bundle for leaked credentials
        run: |
          # Only the renderer build (vite) is exercised in CI — the full
          # `npm run build` also bundles the sidecar binary and invokes
          # `tauri build`, which requires the macOS toolchain. The credential
          # leak we care about is in the renderer's JS, which vite produces
          # into dist/ regardless of platform.
          npm run build:renderer
          # Tight patterns to avoid false positives on placeholder strings
          # in the UI (e.g. `your-client-id.apps.googleusercontent.com`
          # and `GOCSPX-…` are legitimate input placeholders).
          #   Real client ID: `<digits>-<alphanum>.apps.googleusercontent.com`
          #   Real secret:    `GOCSPX-<≥20 char alphanum/underscore/dash>`
          if grep -rEq '[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com|GOCSPX-[A-Za-z0-9_-]{20,}' dist/; then
            echo "ERROR: Google OAuth credentials found in renderer bundle!"
            echo "Ensure MAIN_VITE_GOOGLE_CLIENT_ID and MAIN_VITE_GOOGLE_CLIENT_SECRET are not set in CI."
            grep -rEn '[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com|GOCSPX-[A-Za-z0-9_-]{20,}' dist/ | head -5
            exit 1
          fi

  # The end-to-end test suite is currently disabled in CI. Background:
  #
  #   * The app migrated from Electron to Tauri. All tests under tests/e2e/
  #     still import `ElectronApplication` from @playwright/test and launch
  #     via Electron-specific helpers — they cannot drive a Tauri webview.
  #   * playwright.config.ts already retired the Electron-era `unit` and
  #     `integration` projects (archived to tests/legacy-*); only `e2e`
  #     remains, and it is itself Electron-coupled.
  #   * scripts/run-tests.sh references those archived projects and runs
  #     `npx @electron/rebuild` on better-sqlite3 — none of which applies
  #     to Tauri.
  #   * The current `Tests` job has been red on every PR since the
  #     migration. Keeping a permanently-failing required check makes the
  #     real signal harder to read.
  #
  # Restoring this job is its own piece of work: pick a Tauri E2E approach
  # (tauri-driver + WebdriverIO, or Playwright against the dev URL), port
  # the existing fixtures, and wire `runs-on: macos-latest` since the app
  # is macOS-only.
  #
  # test:
  #   name: Tests
  #   runs-on: macos-latest  # Tauri app is macOS-only — Linux can't build it
  #   ...
