[package]
name = "aos-mail"
version = "0.1.2"
description = "AOS Mail — Agent Operated System for Mail"
authors = ["MR Dula Solutions"]
edition = "2021"

[lib]
name = "aos_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
thiserror = "2"
# Keyring crate exposes the OS-native secret store (macOS Keychain on Mac,
# libsecret on Linux, Credential Manager on Windows). Used by keychain.rs
# to back the renderer's `keychain_*` invoke commands.
# `apple-native` selects the macOS Security framework backend (vs the default
# pluggable `linux-native`/`windows-native` selection) — we always want the
# OS provider, never an in-memory fallback.
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }

[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.5"
cocoa = "0.26"
objc = "0.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
